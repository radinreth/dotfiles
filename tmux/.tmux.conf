unbind C-b

set -g prefix C-a
set -g base-index 1
setw -g pane-base-index 1

# Mouse
set -g mouse on
set -g history-limit 100000

set -g focus-events on

unbind x
bind x confirm-before -p "kill-pane #P? (y/n)" kill-pane
# bind X kill-session

# split
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# send command to a program running inside tmux
bind-key -r C-a send-prefix

# reload tmux config
bind-key r source-file ~/.tmux.conf \; display-message "~/.tmux.conf reloaded"

bind-key -n C-h select-pane -L
bind-key -n C-j select-pane -D
bind-key -n C-k select-pane -U
bind-key -n C-l select-pane -R

set -g alternate-screen on
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"
set -ga terminal-overrides '*:Ss=\E[%p1%d q:Se=\E[ q'
set-option -g status-keys "emacs"

set-option -g status-bg "#666666"
set-option -g status-fg "#aaaaaa"

set-option -g status-left-length "50"
set-option -g status-right "#(date '+%a,%b%d-%I:%M') "

#bind-key - split-window -v -c '#{pane_current_path}'
#bind-key \ split-window -h -c '#{pane_current_path}'

#bind -n S-Left resize-pane -L 2
#bind -n S-Right resize-pane -R 2
#bind -n S-Down resize-pane -D 1
#bind -n S-Up resize-pane -U 1

bind -n S-Left resize-pane -L 5
bind -n S-Right resize-pane -R 5
bind -n S-Down resize-pane -D 5
bind -n S-Up resize-pane -U 5

# swap window left/right and follow it (prefix + H / L, repeatable)
# NB: C-S-Left/Right can't be used - macOS Mission Control (AppleSymbolicHotKeys
# 80/82) consumes those system-wide before iTerm2 ever sees them.
bind -r H swap-window -t -1 \; select-window -t -1
bind -r L swap-window -t +1 \; select-window -t +1

bind c new-window -c '#{pane_current_path}'

set-option -g base-index 1
set-option -g renumber-windows on

# bind -n C-k send-keys -R \; clear-history

bind-key b break-pane -d
bind-key C-j choose-tree

# TPM
set -g @plugin 'tmux-plugins/tpm'
# Save/restore sessions
set -g @plugin 'tmux-plugins/tmux-resurrect'
# Auto save
set -g @plugin 'tmux-plugins/tmux-continuum'

# Enable automatic restore
set -g @continuum-restore 'on'

# VI Mode Keybindings
set -w -g mode-keys vi

# Sort by most recently used (activity):
bind s choose-tree -sZ -O time

run '~/.tmux/plugins/tpm/tpm'
